<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>A Little Birthday Surprise 💌</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="page intro-page">

    <div class="glow"></div>

    <section class="card envelope">

        <div class="surprise-intro">
            And this is a surprise for you 💌
        </div>

        <div class="open-label">
            Open will be enabled in…
        </div>

        <div class="countdown" aria-live="polite">
            3
        </div>

        <!-- HEART -->
        <div class="heart-wrapper">
            <div class="heart">❤️</div>
        </div>

        <div class="icon heartbeat">
            💗
        </div>

        <p class="tiny">
            A little surprise is waiting
        </p>

        <h1>
            I Have a<br>
            <span>Message For You</span>
        </h1>

        <p class="lead">
            Don't open this unless you're ready for a smile,
            a few memories, and a whole lot of birthday love. ✨
        </p>

        <!-- BUTTON -->
        <a
            id="openButton"
            class="btn surprise-btn is-disabled"
            href="birthday.html"
            aria-disabled="true"
            tabindex="-1"
        >
            🔒 Open My Message 💗
        </a>

    </section>

</main>


<script src="script.js"></script>

</body>
</html>
